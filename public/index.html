<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wacky Woods</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Game Canvas -->
  <div class="game-wrapper" id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    
    <!-- UI Overlay Layer -->
    <div id="ui-layer">
      
      <!-- Persistent Currency HUD -->
      <div id="currency-hud" class="currency-badge">
        ACORNS: <span id="coin-count">0</span>
      </div>

      <!-- Main Menu Scene -->
      <div id="main-menu" class="scene active menu-transparent">
        <h1 class="game-logo">WACKY<br>WOODS</h1>
        
        <div class="menu-layout">
          <button class="menu-btn giant-play-btn" id="play-online-btn">
            <span class="btn-title" style="font-size: 36px; color: #d35400;">PLAY NOW!</span>
            <span class="btn-desc" style="color: #e17055;">Find Random Animals</span>
          </button>
          
          <div class="menu-row">
            <button class="menu-btn side-btn" id="play-friend-btn">CREATE FOREST</button>
            <div class="join-room-box">
              <input type="text" id="room-code-input" placeholder="CODE" maxlength="6">
              <button class="menu-btn join-btn" id="join-room-btn">JOIN</button>
            </div>
          </div>

          <div class="menu-row bottom-row">
            <button class="menu-btn icon-btn" onclick="changeScene('PROFILE')">PROFILE</button>
            <button class="menu-btn icon-btn" onclick="changeScene('SHOP')">SHOP</button>
          </div>
        </div>
      </div>

      <!-- Shop Scene -->
      <div id="shop" class="scene">
        <h2 class="scene-title">WACKY SHOP</h2>
        <div class="shop-grid" id="shop-grid">
          <!-- JS injects items here -->
        </div>
        <button class="btn secondary-btn" onclick="changeScene('MAIN_MENU')" style="margin-top: 30px;">BACK TO WOODS</button>
      </div>

      <!-- Profile Scene -->
      <div id="profile" class="scene">
        <h2 class="scene-title">ANIMAL PROFILE</h2>
        
        <div class="profile-editor">
          <div class="avatar-editor">
            <div id="avatar-frame-container" class="avatar-frame-default">
              <img id="profile-avatar-preview" src="" alt="Avatar">
            </div>
            <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
            <button class="btn primary-btn" onclick="document.getElementById('avatar-upload').click()">UPLOAD IMAGE</button>
          </div>
          
          <div class="profile-stats-grid">
            <div class="stat-box">
              <div class="stat-label">TOTAL RUNS</div>
              <div class="stat-value" id="stat-matches">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">FIRST PLACES</div>
              <div class="stat-value" id="stat-wins">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">WIN RATE</div>
              <div class="stat-value" id="stat-winrate">0%</div>
            </div>
          </div>
        </div>
        
        <button class="btn secondary-btn" onclick="changeScene('MAIN_MENU')">BACK TO WOODS</button>
      </div>

      <!-- Waiting Lobby Scene -->
      <div id="waiting-lobby" class="scene">
        <h2 class="scene-title">FINDING A CLEARING</h2>
        <div class="loader-ring"></div>
        <div id="waiting-text" class="status-text">LOOKING FOR ANIMALS...</div>
        <button class="btn secondary-btn" id="cancel-match-btn" style="margin-top: 30px;">CANCEL</button>
      </div>

      <!-- Game Over Scene -->
      <div id="game-over" class="scene">
        <h1 class="scene-title" id="winner-text">RACE OVER!</h1>
        <h2 id="reward-text" style="color: #00b894; margin-bottom: 30px; font-size: 32px; font-weight: 900;"></h2>
        <button class="btn primary-btn" id="return-menu-btn">BACK TO WOODS</button>
      </div>
      
      <!-- In-Game HUD -->
      <div id="in-game-hud" class="hidden">
        <div class="hud-top">
          <div class="hud-player" id="hud-p1">
            <span class="hud-name">PIG (P1)</span>
          </div>
          <div class="hud-status" id="shift-timer">DIZZY IN: 5.0</div>
          <div class="hud-player" id="hud-p2">
            <span class="hud-name">CHICKEN (P2)</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
