<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Grid</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Game Canvas -->
  <div class="game-wrapper" id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    
    <!-- UI Overlay Layer -->
    <div id="ui-layer">
      
      <!-- Navbar (Only visible in Menus) -->
      <nav id="navbar">
        <div class="nav-brand">INVERTIGO</div>
        <div class="nav-coins">CREDITS: <span id="coin-count">0</span></div>
      </nav>

      <!-- Main Menu Scene -->
      <div id="main-menu" class="scene active">
        <div class="main-menu-grid">
          <button class="menu-btn" id="play-online-btn">
            <span class="btn-title">PLAY ONLINE</span>
            <span class="btn-desc">Ranked Matchmaking</span>
          </button>
          <button class="menu-btn" id="play-friend-btn">
            <span class="btn-title">PLAY WITH FRIEND</span>
            <span class="btn-desc">Create Room</span>
          </button>
          
          <div class="join-room-box">
            <input type="text" id="room-code-input" placeholder="ENTER CODE" maxlength="6">
            <button class="menu-btn join-btn" id="join-room-btn">JOIN</button>
          </div>

          <button class="menu-btn" onclick="changeScene('PROFILE')">
            <span class="btn-title">PROFILE</span>
            <span class="btn-desc">Stats & Avatar</span>
          </button>
          <button class="menu-btn" onclick="changeScene('SHOP')">
            <span class="btn-title">SHOP</span>
            <span class="btn-desc">Cosmetics</span>
          </button>
        </div>
      </div>

      <!-- Shop Scene -->
      <div id="shop" class="scene glass-panel">
        <h2 class="scene-title">BLACK MARKET</h2>
        <div class="shop-grid" id="shop-grid">
          <!-- JS injects items here -->
        </div>
        <button class="btn secondary-btn" onclick="changeScene('MAIN_MENU')" style="margin-top: 30px;">BACK TO TERMINAL</button>
      </div>

      <!-- Profile Scene -->
      <div id="profile" class="scene glass-panel">
        <h2 class="scene-title">OPERATOR PROFILE</h2>
        
        <div class="profile-editor">
          <div class="avatar-editor">
            <div id="avatar-frame-container" class="avatar-frame-default">
              <img id="profile-avatar-preview" src="" alt="Avatar">
            </div>
            <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
            <button class="btn primary-btn" onclick="document.getElementById('avatar-upload').click()">UPLOAD IMAGE</button>
          </div>
          
          <div class="profile-stats-grid">
            <div class="stat-box">
              <div class="stat-label">TOTAL MATCHES</div>
              <div class="stat-value" id="stat-matches">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">VICTORIES</div>
              <div class="stat-value" id="stat-wins">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">WIN RATE</div>
              <div class="stat-value" id="stat-winrate">0%</div>
            </div>
          </div>
        </div>
        
        <button class="btn secondary-btn" onclick="changeScene('MAIN_MENU')">BACK TO TERMINAL</button>
      </div>

      <!-- Waiting Lobby Scene -->
      <div id="waiting-lobby" class="scene glass-panel">
        <h2 class="scene-title">UPLINK ESTABLISHED</h2>
        <div class="loader-ring"></div>
        <div id="waiting-text" class="status-text">ESTABLISHING CONNECTION...</div>
        <button class="btn secondary-btn" id="cancel-match-btn" style="margin-top: 30px;">ABORT</button>
      </div>

      <!-- Game Over Scene -->
      <div id="game-over" class="scene glass-panel">
        <h1 class="scene-title" id="winner-text">TRANSMISSION ENDED</h1>
        <h2 id="reward-text" style="color: #2ecc71; margin-bottom: 30px; font-size: 2rem;"></h2>
        <button class="btn primary-btn" id="return-menu-btn">RETURN TO TERMINAL</button>
      </div>
      
      <!-- In-Game HUD -->
      <div id="in-game-hud" class="hidden">
        <div class="hud-top">
          <div class="hud-player" id="hud-p1">
            <span class="hud-name">P1 (BLUE)</span>
          </div>
          <div class="hud-status" id="shift-timer">SHIFT IN: 5.0</div>
          <div class="hud-player" id="hud-p2">
            <span class="hud-name">P2 (RED)</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
