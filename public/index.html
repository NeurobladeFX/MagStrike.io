<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagStrike.io Multiplayer</title>
  <link rel="icon" href="data:,"> 
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  
  <!-- Global Navbar -->
  <nav id="navbar">
    <div class="nav-brand">MagStrike.io</div>
    <div class="nav-links">
      <button class="nav-btn" onclick="changeScene('MAIN_MENU')">Play</button>
      <button class="nav-btn" onclick="changeScene('SHOP')">Shop</button>
      <button class="nav-btn" onclick="changeScene('PROFILE')">Profile</button>
    </div>
    <div class="nav-coins">Ȼ <span id="coin-count">0</span></div>
  </nav>

  <div id="game-container">
    <div class="game-wrapper">
      <canvas id="gameCanvas" width="1200" height="800"></canvas>
      
      <!-- UI Layer for Overlays -->
      <div id="ui-layer">
      
      <!-- Main Menu Scene -->
      <div id="main-menu" class="scene active glass-panel">
        <h1 class="title">MagStrike.io</h1>
        <p class="subtitle">Welcome, <span id="welcome-name">Player</span>!</p>
        
        <div class="action-buttons">
          <button class="btn primary-btn" id="play-random-btn">Find Random Match</button>
          <button class="btn primary-btn" id="create-room-btn">Create Private Room</button>
        </div>
        
        <div class="room-joiner">
          <input type="text" id="room-code-input" placeholder="ENTER CODE" maxlength="4">
          <button class="btn primary-btn" id="join-room-btn">Join</button>
        </div>
        
        <div id="matchmaking-status" class="status-text"></div>
        
        <div class="controls-panel">
          <div class="control-col p1-controls">
            <h3>Controls</h3>
            <p><span>WASD</span> Move</p>
            <p><span>Q</span> Attract</p>
            <p><span>E</span> Repulse</p>
          </div>
        </div>
      </div>
      
      <!-- Shop Scene -->
      <div id="shop" class="scene glass-panel">
        <h2 class="scene-title">Cosmetics Shop</h2>
        <div class="shop-grid" id="shop-grid">
          <!-- JS injects items here -->
        </div>
      </div>

      <!-- Profile Scene -->
      <div id="profile" class="scene glass-panel">
        <h2 class="scene-title">Player Profile</h2>
        
        <div class="profile-editor">
          <label for="username-input">Username:</label>
          <input type="text" id="username-input" maxlength="12" placeholder="Enter username...">
          <button class="btn primary-btn" id="save-profile-btn" style="padding: 10px 20px; font-size: 1rem;">Save</button>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" id="stat-wins">0</div>
            <div class="stat-label">Total Wins</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="stat-matches">0</div>
            <div class="stat-label">Matches Played</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="stat-goals">0</div>
            <div class="stat-label">Goals Scored</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="stat-winrate">0%</div>
            <div class="stat-label">Win Rate</div>
          </div>
        </div>
      </div>
      
      <!-- Gameplay UI -->
      <div id="gameplay-ui" class="scene" style="pointer-events: none; background: transparent; backdrop-filter: none;">
        <div id="room-code-display" class="room-code"></div>
        <div class="scoreboard">
          <div class="score p1-score" id="p1-score">0</div>
          <div class="score p2-score" id="p2-score">0</div>
        </div>
      </div>
      
      <!-- Game Over Scene -->
      <div id="game-over" class="scene glass-panel" style="width: auto; height: auto; padding: 50px; border-radius: 20px;">
        <h2 class="winner-text" id="winner-text">Game Over!</h2>
        <p class="reward-text" id="reward-text"></p>
        <button class="btn primary-btn" id="return-menu-btn">Return to Menu</button>
      </div>

      <!-- Versus Screen -->
      <div id="versus-screen" class="scene" style="background: #000; z-index: 500;">
        <div class="vs-container">
          <div class="vs-player vs-blue">
            <img src="assets/avatar_1.png" alt="Avatar" class="vs-avatar" id="vs-p1-avatar">
            <h2 id="vs-p1-name">Player 1</h2>
          </div>
          <div class="vs-lightning">VS</div>
          <div class="vs-player vs-red">
            <img src="assets/avatar_2.png" alt="Avatar" class="vs-avatar" id="vs-p2-avatar">
            <h2 id="vs-p2-name">Player 2</h2>
          </div>
        </div>
        <div class="vs-countdown" id="vs-countdown">3</div>
      </div>

      <!-- Dedicated Waiting Lobby -->
      <div id="waiting-lobby" class="scene glass-panel" style="padding: 60px;">
        <h2 class="scene-title">Matchmaking</h2>
        <div class="loader-ring" style="width: 120px; height: 120px; margin-bottom: 30px; border-width: 15px;"></div>
        <div id="waiting-text" style="font-size: 2.5rem; font-weight: 900; color: #ff7675; text-shadow: 2px 2px 0 #fff; margin-bottom: 20px;">SEARCHING FOR OPPONENT...</div>
        <button class="btn secondary-btn" id="cancel-matchmaking-btn">Cancel</button>
      </div>

      <!-- Global Loader -->
      <div id="global-loader" class="scene" style="background: rgba(255,255,255,0.9); z-index: 999; display: flex;">
        <div class="loader-ring"></div>
        <div style="margin-top: 20px; font-weight: bold; color: #ff7675; font-size: 2rem;">LOADING ASSETS...</div>
      </div>
      
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
